[project]
name = "sentinelops"
version = "0.1.0"
description = "SentinelOps cloud security and resilience platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.44.1,<2.0.0",
  "fastapi>=0.162.5,<1.0.0",
  "pydantic>=2.14.3,<3.0.0",
  "uvicorn>=0.54.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.17.4,<1.0.0",
  "mypy>=2.4.1,<3.0.0",
  "bandit[toml]>=1.9.4,<2.0.0",
  "pip-audit>=2.10.1,<3.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "httpx>=0.28.1,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E501", "I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["arg-type", "attr-defined", "type-var", "union-attr", "var-annotated"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
